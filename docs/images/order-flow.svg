持久化订单</title><g filter="url(#node-shadow)"><rect x="864" y="152" width="240" height="140" rx="10" class="node-surface" fill="#e6f4fe" stroke="#5eb1ef" stroke-width="1"/><rect x="879" y="165" width="25" height="25" rx="6" fill="#f9f9f8"/><svg x="884" y="170" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0d74ce" stroke-width="1.5"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><text x="911" y="181" class="stereotype">数据库</text><text x="879" y="220" class="title">订单数据库</text><text x="879" y="246" class="body">持久化订单</text></g></g><g class="node-drawing"><title>事件队列
承载订单事件</title><g filter="url(#node-shadow)"><rect x="464" y="492" width="240" height="140" rx="10" class="node-surface" fill="#f9f9f8" stroke="#dad9d6" stroke-width="1"/><rect x="479" y="505" width="25" height="25" rx="6" fill="#f9f9f8"/><svg x="484" y="510" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#21201c" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><text x="511" y="521" class="stereotype">组件</text><text x="479" y="560" class="title">事件队列</text><text x="479" y="586" class="body">承载订单事件</text></g></g><g class="node-drawing"><title>通知服务
消费事件并发送通知</title><g filter="url(#node-shadow)"><rect x="864" y="492" width="240" height="140" rx="10" class="node-surface" fill="#f9f9f8" stroke="#dad9d6" stroke-width="1"/><rect x="879" y="505" width="25" height="25" rx="6" fill="#f9f9f8"/><svg x="884" y="510" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#21201c" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><text x="911" y="521" class="stereotype">服务</text><text x="879" y="560" class="title">通知服务</text><text x="879" y="586" class="body">消费事件并发送通知</text></g></g></svg>
