<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="696" viewBox="0 0 1168 696" role="img" aria-labelledby="title desc"><title id="title">订单服务架构</title><desc id="desc">architecture diagram for QGraphFlow 示例：虚构系统，仅演示图数据与交互，不作为实际源码证据</desc><defs><filter id="node-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#21201c" flood-opacity=".045"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d8d86"/></marker><marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ab6400"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#008573"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0d74ce"/></marker><marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#ffffff" stroke="#8d8d86"/></marker><marker id="diamond-filled" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M1 5L7 1L13 5L7 9Z" fill="#8d8d86"/></marker><marker id="diamond-open" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path d="M1 5L7 1L13 5L7 9Z" fill="#ffffff" stroke="#8d8d86"/></marker><style>.heading{font:650 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#21201c;letter-spacing:-.5px}
.meta{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63635e}
.group{font:650 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63635e;letter-spacing:.4px}
.group-kind,.stereotype{font:600 14px ui-monospace,monospace;fill:#63635e;letter-spacing:.7px}
.title,.participant-title{font:650 20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#21201c}
.shape-title{font:650 20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#21201c}
.body{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63635e}
.edge,.cardinality{font:500 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63635e}
.edge-bg{fill:#ffffff;stroke:none}
.field-key{font:700 14px ui-monospace,monospace;fill:#008573}
.field-name{font:500 16px ui-monospace,monospace;fill:#63635e}
.compact-title{font:650 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#21201c}
.compact-body{font:400 10px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63635e}
.core-node .compact-title,.core-node .compact-body{fill:#0d3d38}
.entity-title{font:650 20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#21201c}
.entity-meta{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#0d74ce}
.member{font:500 16px ui-monospace,monospace;fill:#63635e}
.field-type{font:400 14px ui-monospace,monospace;fill:#63635e}
.core-node .title,.core-node .shape-title,.core-node .participant-title{fill:#0d3d38}
.core-node .body,.core-node .stereotype{fill:#0d3d38;opacity:.76}</style></defs><rect width="100%" height="100%" fill="#fdfdfc"/><rect x="24" y="88" width="1120" height="584" rx="16" fill="#ffffff" stroke="#dad9d6"/><text x="64" y="43" class="heading">订单服务架构</text><g><path d="M 304 222 H 464" fill="none" stroke="#8d8d86" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="346" y="207" width="76" height="30" rx="4" class="edge-bg"/><text x="384" y="226" class="edge" text-anchor="middle">创建订单</text></g><g><path d="M 704 222 H 864" fill="none" stroke="#0d74ce" stroke-width="1.5" marker-end="url(#arrow-data)"/><rect x="746" y="207" width="76" height="30" rx="4" class="edge-bg"/><text x="784" y="226" class="edge" text-anchor="middle">保存订单</text></g><g><path d="M 584 292 V 492" fill="none" stroke="#8d8d86" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="546" y="377" width="76" height="30" rx="4" class="edge-bg"/><text x="584" y="396" class="edge" text-anchor="middle">订单事件</text></g><g><path d="M 704 562 H 864" fill="none" stroke="#8d8d86" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="746" y="547" width="76" height="30" rx="4" class="edge-bg"/><text x="784" y="566" class="edge" text-anchor="middle">异步通知</text></g><g class="node-drawing"><title>客户端
