name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/q-flow/assets/viewer/package-lock.json
      - run: npm ci --prefix skills/q-flow/assets/viewer
      - run: npm run build --prefix skills/q-flow/assets/viewer
      - run: node --test tests/*.test.mjs skills/q-flow/scripts/*.test.mjs
      - run: node skills/q-flow/scripts/validate-graph.mjs examples/order-flow.graph.json --input-only
      - run: node skills/q-flow/scripts/generate-viewer.mjs examples/order-flow.graph.json output/example
      - run: npm run package
