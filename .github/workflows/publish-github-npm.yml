name: Publish GitHub npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing software Release version (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'supermax92/qgraphflow' && github.actor == 'supermax92' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Release and prepare scoped runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' | grep -qx true
          mkdir release runtime publish
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "qgraphflow-$VERSION.zip" --pattern "qgraphflow-$VERSION.tgz" --pattern SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          unzip -q "release/qgraphflow-$VERSION.zip" -d runtime
          node scripts/prepare-github-npm.mjs runtime "$VERSION"
          (cd runtime && npm pack --ignore-scripts --pack-destination ../publish)
      - name: Install and verify the candidate
        run: |
          npm install --prefix verified --ignore-scripts --no-audit --no-fund --package-lock=false "./publish/supermax92-qgraphflow-$VERSION.tgz"
          diff -r runtime verified/node_modules/@supermax92/qgraphflow
          node verified/node_modules/@supermax92/qgraphflow/skills/q-flow/scripts/validate-graph.mjs verified/node_modules/@supermax92/qgraphflow/examples/jeepay/flowchart.graph.json --input-only
          node verified/node_modules/@supermax92/qgraphflow/skills/q-flow/scripts/generate-viewer.mjs verified/node_modules/@supermax92/qgraphflow/examples/jeepay/flowchart.graph.json output/order
          # Generate the complete real-source Jeepay collection with the installed package.
          node verified/node_modules/@supermax92/qgraphflow/skills/q-flow/scripts/generate-viewer.mjs examples/jeepay/collection.graph.json output/eleven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@supermax92'
      - name: Publish only to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish "./publish/supermax92-qgraphflow-$VERSION.tgz" --registry=https://npm.pkg.github.com --access public --ignore-scripts
      - name: Verify registry download and installed payload
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded
          npm pack "@supermax92/qgraphflow@$VERSION" --registry=https://npm.pkg.github.com --ignore-scripts --pack-destination downloaded
          cmp "publish/supermax92-qgraphflow-$VERSION.tgz" "downloaded/supermax92-qgraphflow-$VERSION.tgz"
          npm install --prefix registry-check --registry=https://npm.pkg.github.com --ignore-scripts --no-audit --no-fund --package-lock=false "@supermax92/qgraphflow@$VERSION"
          diff -r runtime registry-check/node_modules/@supermax92/qgraphflow
          node registry-check/node_modules/@supermax92/qgraphflow/skills/q-flow/scripts/generate-viewer.mjs registry-check/node_modules/@supermax92/qgraphflow/examples/jeepay/flowchart.graph.json output/registry

  # npmjs.com: the Release tarball itself, published through npm trusted publishing (GitHub OIDC) with provenance.
  # No npm token is stored anywhere; npmjs.com trusts this repository and this workflow file name.
  npmjs:
    if: github.repository == 'supermax92/qgraphflow' && github.actor == 'supermax92' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify the Release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' | grep -qx true
          mkdir release
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "qgraphflow-$VERSION.zip" --pattern "qgraphflow-$VERSION.tgz" --pattern SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          tar -xOzf "release/qgraphflow-$VERSION.tgz" package/package.json | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); if (p.name !== "qgraphflow" || p.version !== process.env.VERSION) process.exit(1)'
      - name: Publish the Release tarball unchanged
        run: |
          # npmjs.com never accepts a version twice. A version already there, such as a first version published by hand
          # before a trusted publisher could be configured, is not published again; the next step still verifies it.
          if [ "$(npm view "qgraphflow@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "qgraphflow@$VERSION is already on npmjs.com; verifying it instead of publishing."
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
          npm install -g npm@^11.5.1
          # "./" keeps npm from reading release/<file> as a GitHub owner/repo shorthand.
          # npm logs a refused trusted-publishing token exchange only at verbose level, then fails the upload with a bare 404.
          npm publish "./release/qgraphflow-$VERSION.tgz" --provenance --access public --ignore-scripts --loglevel verbose
      - name: Verify the npmjs download and run it through npx
        run: |
          mkdir downloaded
          for attempt in 1 2 3 4 5 6; do npm pack "qgraphflow@$VERSION" --ignore-scripts --pack-destination downloaded && break; sleep 10; done
          cmp "release/qgraphflow-$VERSION.tgz" "downloaded/qgraphflow-$VERSION.tgz"
          # Run npx outside the checkout: its package.json is qgraphflow@$VERSION itself, which npx would take for an
          # installed copy, skipping the registry and failing with "qgraphflow: not found".
          mkdir -p "$RUNNER_TEMP/npx/examples/jeepay" && cp examples/jeepay/flowchart.graph.json "$RUNNER_TEMP/npx/examples/jeepay/" && cd "$RUNNER_TEMP/npx"
          npx -y "qgraphflow@$VERSION" validate --help
          npx -y "qgraphflow@$VERSION" validate examples/jeepay/flowchart.graph.json --input-only
          npx -y "qgraphflow@$VERSION" generate examples/jeepay/flowchart.graph.json output/npmjs
          test -f output/npmjs/diagram.svg
