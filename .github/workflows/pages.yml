name: Pages

# The online demo is generated from the repository examples with the committed prebuilt Viewer, the same one an
# installed plugin uses. The site is uploaded as a Pages artifact and never committed to any branch.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/actions/jeepay-source/**'
      - 'skills/q-flow/scripts/**'
      - 'skills/q-flow/assets/**'
      - 'docs/pages/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'examples/**'
      - '.github/actions/jeepay-source/**'
      - 'skills/q-flow/scripts/**'
      - 'skills/q-flow/assets/**'
      - 'docs/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: ./.github/actions/jeepay-source
      - name: Generate and validate the Jeepay source corpus
        run: |
          node skills/q-flow/scripts/generate-viewer.mjs examples/jeepay/collection.graph.json site/jeepay/zh-CN --repo-root output/jeepay-source
          node skills/q-flow/scripts/validate-graph.mjs site/jeepay/zh-CN/graph.json --repo-root output/jeepay-source
          cp docs/pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
